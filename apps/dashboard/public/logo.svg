<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="aiCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" />

  <!-- Left Code Bracket { -->
  <path d="M 170 140 C 130 140 120 180 120 210 L 120 230 C 120 250 95 256 80 256 C 95 256 120 262 120 282 L 120 302 C 120 332 130 372 170 372"
        fill="none" stroke="url(#bracketGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Right Code Bracket } -->
  <path d="M 342 140 C 382 140 392 180 392 210 L 392 230 C 392 250 417 256 432 256 C 417 256 392 262 392 282 L 392 302 C 392 332 382 372 342 372"
        fill="none" stroke="url(#bracketGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- AI Neural Core & Scanning Eye -->
  <circle cx="256" cy="256" r="64" fill="#0f172a" stroke="url(#aiCoreGrad)" stroke-width="12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="url(#bracketGrad)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />

  <!-- Holographic Checkmark / Precision Sparkle -->
  <path d="M 235 256 L 250 271 L 282 239" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Neural Nodes -->
  <circle cx="256" cy="140" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="372" r="10" fill="#34d399" filter="url(#glow)" />
  <line x1="256" y1="155" x2="256" y2="185" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4" stroke-opacity="0.8" />
  <line x1="256" y1="327" x2="256" y2="357" stroke="#34d399" stroke-width="4" stroke-dasharray="6,4" stroke-opacity="0.8" />
</svg>
